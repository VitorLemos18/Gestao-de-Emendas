name: emendas-gestao
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emendas
      POSTGRES_USER: emendas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Gere o arquivo .env com Preparar-Ambiente.ps1}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - emendas_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emendas -d emendas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    profiles: ["app"]
    build: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/emendas
      DB_USER: emendas
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  emendas_database:
